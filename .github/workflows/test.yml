name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  test:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        # ARM64 tests cannot run on windows-latest (x64 only), but x64 tests cover all logic
        platform: [x64]
        configuration: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore AgentsWinBar.sln

      - name: Build
        run: dotnet build AgentsWinBar.sln -c ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} -p:PublishReadyToRun=false --no-restore

      - name: Run unit tests
        run: dotnet test AgentsWinBar.Tests.Unit/AgentsWinBar.Tests.Unit.csproj -c ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.platform }}
          path: AgentsWinBar.Tests.Unit/TestResults/
          retention-days: 7

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: AgentsWinBar.Tests.Unit/TestResults/**/coverage.cobertura.xml
          flags: unittests
          name: codecov-${{ matrix.platform }}
          fail_ci_if_error: false
          verbose: true
