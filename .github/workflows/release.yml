# Stable signing setup (run locally; use a strong password and keep the PFX private):
# $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=CodexBarWin OSS" -KeyUsage DigitalSignature -NotAfter (Get-Date).AddYears(10) -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
# $password = Read-Host "PFX password" -AsSecureString; Export-PfxCertificate -Cert $cert -FilePath signing.pfx -Password $password
# [IO.File]::WriteAllText("signing.base64", [Convert]::ToBase64String([IO.File]::ReadAllBytes("signing.pfx")))
# gh secret set SIGNING_PFX_BASE64 < signing.base64  (use a shell supporting input redirection)
# gh secret set SIGNING_PFX_PASSWORD  (enter the same password at the prompt)
# The certificate's thumbprint must equal $ExpectedReleaseCertificateThumbprint in install.ps1; the cert job checks it.
# Actions are pinned to commit SHAs (the tag each SHA had is in the trailing comment).
name: Release

on:
  push:
    tags:
      - 'v*'

# Cancel in-progress runs for the same tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: ${{ github.ref_name }}
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          pattern='^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$'
          if [[ ! "$TAG" =~ $pattern ]]; then
            echo "Release tag must be vX.Y.Z with canonical numeric components." >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "${TAG#v}"
          for component in "$major" "$minor" "$patch"; do
            if (( 10#$component > 65535 )); then
              echo "Release version components must not exceed 65535." >&2
              exit 1
            fi
          done

  tests:
    needs: validate
    uses: ./.github/workflows/test.yml

  licenses:
    needs: validate
    uses: ./.github/workflows/licenses.yml

  cert:
    needs: [validate, tests, licenses]
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          # Every release is signed with the one stable certificate users have already trusted. There is no
          # throwaway fallback: a new certificate would need a new admin prompt on every machine, and sharing its
          # private key between jobs would expose it.
          if (-not ($env:SIGNING_PFX_BASE64 -and $env:SIGNING_PFX_PASSWORD)) {
            throw "Repository secrets SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD are required to sign a release (see the comment at the top of this workflow)."
          }
          New-Item -ItemType Directory -Path signing | Out-Null
          $pfx = Join-Path $env:RUNNER_TEMP 'AgentsWinBar.pfx'
          $imported = @()
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString -String $env:SIGNING_PFX_PASSWORD -Force -AsPlainText
            $imported = @(Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation "Cert:\CurrentUser\My")
            Remove-Item -LiteralPath $pfx -Force
            $cert = @($imported | Where-Object { $_.HasPrivateKey })
            if ($cert.Count -ne 1) { throw "Signing PFX must contain exactly one certificate with a private key." }
            $cert = $cert[0]

            [xml]$manifest = Get-Content Package.appxmanifest -Raw
            if ($cert.Subject -ne $manifest.Package.Identity.Publisher) {
              throw "Signing certificate subject must match Package.appxmanifest Publisher."
            }
            # Installers refuse any other signer, so a swapped or rotated secret must fail here, not on users' PCs.
            $pin = Select-String -Path install.ps1 -Pattern '^\$ExpectedReleaseCertificateThumbprint = ''([A-F0-9]{40})''' | Select-Object -First 1
            if (-not $pin) { throw "install.ps1 does not pin a release certificate thumbprint." }
            if ($cert.Thumbprint -ne $pin.Matches[0].Groups[1].Value) {
              throw "The signing certificate differs from the thumbprint pinned in install.ps1."
            }
            Export-Certificate -Cert $cert -FilePath "signing/AgentsWinBar-$env:TAG-Certificate.cer" | Out-Null
            Copy-Item "signing/AgentsWinBar-$env:TAG-Certificate.cer" signing/AgentsWinBar-Certificate.cer
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            foreach ($item in $imported) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($item.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue }
          }

      - name: Upload public certificates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-certificate
          path: signing/*.cer
          retention-days: 1
          if-no-files-found: error

  build:
    needs: [validate, tests, licenses]
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Required for MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      # No package cache: a release restores everything fresh from NuGet.
      - name: Restore dependencies
        run: dotnet restore AgentsWinBar.csproj -p:Platform=${{ matrix.platform }}

      - name: Update Package.appxmanifest version
        shell: pwsh
        run: |
          $appxVersion = "$($env:TAG.Substring(1)).0"
          Write-Host "Setting version to: $appxVersion"

          # Update Package.appxmanifest (only Identity Version, not MinVersion)
          $manifestPath = "Package.appxmanifest"
          $content = Get-Content $manifestPath -Raw
          $content = $content -replace '(<Identity[^>]*Version=")[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+"', "`${1}$appxVersion`""
          Set-Content $manifestPath $content -NoNewline
          Write-Host "Updated Package.appxmanifest with version $appxVersion"

      - name: Build MSIX package
        shell: pwsh
        run: |
          $appxVersion = "$($env:TAG.Substring(1)).0"
          Write-Host "Building with AppxVersion: $appxVersion"

          msbuild AgentsWinBar.csproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never /p:AppxPackageDir="AppPackages\" /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=true /p:PublishReadyToRun=false /p:AppxVersion="$appxVersion"

          # Packaging also writes the Windows App Runtime framework packages under Dependencies\ (install.ps1
          # installs that runtime itself), so match only the app's own package.
          $msix = @(Get-ChildItem -Path "AppPackages" -Filter "AgentsWinBar_*.msix" -Recurse |
            Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          if ($msix.Count -ne 1) { throw "Expected exactly one AgentsWinBar MSIX package, found $($msix.Count)." }
          New-Item -ItemType Directory -Path unsigned | Out-Null
          Copy-Item $msix[0].FullName -Destination unsigned/AgentsWinBar-unsigned.msix

      - name: Upload unsigned package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.platform }}
          path: unsigned/AgentsWinBar-unsigned.msix
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: [validate, tests, licenses, cert, build]
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    # The private key is only ever on this runner, which checks out no code and restores and builds nothing: it
    # receives the unsigned package and the public certificate, and runs the Windows SDK signtool.
    steps:
      - name: Download unsigned package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-${{ matrix.platform }}
          path: unsigned

      - name: Download public certificates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-certificate
          path: signing

      - name: Sign MSIX package
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $msix = (Resolve-Path unsigned/AgentsWinBar-unsigned.msix).Path
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object { [version]($_.Directory.Parent.Name -replace '\.0$', '') } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found." }
          if (-not ($env:SIGNING_PFX_BASE64 -and $env:SIGNING_PFX_PASSWORD)) { throw "Signing secrets are missing." }
          $published = [Security.Cryptography.X509Certificates.X509Certificate2]::new("$PWD\signing\AgentsWinBar-$env:TAG-Certificate.cer")
          $pfx = Join-Path $env:RUNNER_TEMP 'AgentsWinBar.pfx'
          $imported = @()
          try {
            # The key goes into this runner's certificate store and signtool selects it by thumbprint, so the
            # password never appears on a command line and the PFX file is gone before signtool runs.
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString -String $env:SIGNING_PFX_PASSWORD -Force -AsPlainText
            $imported = @(Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation "Cert:\CurrentUser\My")
            Remove-Item -LiteralPath $pfx -Force
            $cert = @($imported | Where-Object { $_.HasPrivateKey })
            if ($cert.Count -ne 1) { throw "Signing PFX must contain exactly one certificate with a private key." }
            if ($cert[0].Thumbprint -ne $published.Thumbprint) { throw "Signing certificate differs from the published certificate." }
            # Handle native failures explicitly so transient timestamp failures can be retried.
            $PSNativeCommandUseErrorActionPreference = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /s My /sha1 $cert[0].Thumbprint $msix
              $signingExitCode = $LASTEXITCODE
              if ($signingExitCode -eq 0) { break }
              if ($attempt -eq 3) {
                throw "MSIX signing failed after 3 attempts with exit code $signingExitCode."
              }
              Write-Warning "MSIX signing attempt $attempt failed with exit code $signingExitCode. Retrying in 10 seconds."
              Start-Sleep -Seconds 10
            }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            foreach ($item in $imported) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($item.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue }
          }

      - name: Verify MSIX signer matches published certificate
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -FilePath unsigned/AgentsWinBar-unsigned.msix
          $publishedCert = [Security.Cryptography.X509Certificates.X509Certificate2]::new("$PWD\signing\AgentsWinBar-$env:TAG-Certificate.cer")
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $publishedCert.Thumbprint) {
            throw "MSIX signer thumbprint does not match the published certificate."
          }

      - name: Rename and prepare artifacts
        shell: pwsh
        run: |
          $version = $env:TAG
          $platform = "${{ matrix.platform }}"
          Copy-Item unsigned/AgentsWinBar-unsigned.msix -Destination "AgentsWinBar-$version-$platform.msix"
          Copy-Item unsigned/AgentsWinBar-unsigned.msix -Destination "AgentsWinBar-$platform.msix"

      - name: Generate checksum
        shell: pwsh
        run: |
          $version = $env:TAG
          $platform = "${{ matrix.platform }}"
          $hash = (Get-FileHash "AgentsWinBar-$version-$platform.msix" -Algorithm SHA256).Hash.ToLower()
          "$hash  AgentsWinBar-$version-$platform.msix" | Out-File -FilePath "AgentsWinBar-$version-$platform.msix.sha256" -Encoding utf8NoBOM

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            AgentsWinBar-${{ github.ref_name }}-${{ matrix.platform }}.msix
            AgentsWinBar-${{ matrix.platform }}.msix
            AgentsWinBar-${{ github.ref_name }}-${{ matrix.platform }}.msix.sha256
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [validate, cert, build, sign, tests, licenses]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Exact names, never a pattern: any job in the run can upload artifacts, and only the sign and cert jobs'
      # uploads may reach the release (a second upload under one of these names fails in that job).
      - name: Download signed x64 package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-x64
          path: artifacts

      - name: Download signed ARM64 package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-ARM64
          path: artifacts

      - name: Download public certificates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-certificate
          path: artifacts

      - name: Verify release artifacts
        shell: bash
        run: |
          pin=$(sed -n "s/^\$ExpectedReleaseCertificateThumbprint = '\([A-F0-9]\{40\}\)'.*/\1/p" install.ps1 | head -n 1)
          test -n "$pin" || { echo "install.ps1 does not pin a release certificate thumbprint." >&2; exit 1; }
          cd artifacts
          test "$(ls | wc -l)" -eq 8 || { echo "Expected exactly eight release files, found: $(ls | tr '\n' ' ')" >&2; exit 1; }
          cmp "AgentsWinBar-$TAG-Certificate.cer" AgentsWinBar-Certificate.cer
          thumb=$(openssl x509 -inform DER -in "AgentsWinBar-$TAG-Certificate.cer" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g' | tr 'a-f' 'A-F')
          test "$thumb" = "$pin" || { echo "The release certificate differs from the thumbprint pinned in install.ps1." >&2; exit 1; }
          for platform in x64 ARM64; do
            for file in "AgentsWinBar-$TAG-$platform.msix" "AgentsWinBar-$platform.msix" "AgentsWinBar-$TAG-$platform.msix.sha256"; do
              test -f "$file" || { echo "Missing release artifact: $file" >&2; exit 1; }
            done
          done
          for file in "AgentsWinBar-$TAG-Certificate.cer" "AgentsWinBar-Certificate.cer"; do
            test -f "$file" || { echo "Missing release artifact: $file" >&2; exit 1; }
          done
          sed -i 's/\r$//' ./*.msix.sha256
          for platform in x64 ARM64; do
            sha256sum -c "AgentsWinBar-$TAG-$platform.msix.sha256"
            cmp "AgentsWinBar-$platform.msix" "AgentsWinBar-$TAG-$platform.msix"
          done

      - name: Generate combined checksum file
        shell: bash
        run: |
          cd artifacts
          sha256sum *.msix > "AgentsWinBar-$TAG-checksums.sha256"
          test "$(wc -l < "AgentsWinBar-$TAG-checksums.sha256")" -eq 4 || { echo "Combined checksum file must contain exactly four MSIX entries." >&2; exit 1; }
          cp "AgentsWinBar-$TAG-checksums.sha256" AgentsWinBar-checksums.sha256
          rm -f *.msix.sha256

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          VERSION="$TAG"
          VERSION_NUM="${VERSION#v}"
          NOTES=""

          if [ -f "CHANGELOG.md" ]; then
            # First, try to find the specific version section
            NOTES=$(awk -v ver="$VERSION_NUM" '
              /^## \[/ {
                if (found) exit
                if ($0 ~ "\\[" ver "\\]") found=1
                next
              }
              found { print }
            ' CHANGELOG.md)

            # If not found, try [Unreleased] section (for first release)
            if [ -z "$NOTES" ]; then
              NOTES=$(awk '
                /^## \[Unreleased\]/ { found=1; next }
                /^## \[/ { if (found) exit }
                found { print }
              ' CHANGELOG.md)
            fi
          fi

          # Fallback to default message
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Release $VERSION"
          fi

          # Save to file for multiline support
          echo "$NOTES" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release_notes.md
          files: |
            artifacts/*.msix
            artifacts/*.cer
            artifacts/*-checksums.sha256
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
