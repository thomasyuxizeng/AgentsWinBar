name: License Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  check-licenses:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install nuget-license tool
        run: dotnet tool install --global nuget-license

      - name: Restore dependencies
        run: dotnet restore AgentsWinBar.sln

      - name: Generate license report (JSON)
        run: |
          # nuget-license 4.x: --output is the format and --file-output the target. It exits with the number of
          # packages it could not validate (for example one without any license information; the report is still
          # written) and with -1 when it cannot run. Either way the job fails, so nothing is skipped silently.
          nuget-license --input AgentsWinBar.sln --output JsonPretty --file-output licenses.json
          if ($LASTEXITCODE -ne 0) { throw "License JSON report generation failed (exit $LASTEXITCODE)." }
        shell: pwsh

      - name: Generate license report (Table)
        run: |
          nuget-license --input AgentsWinBar.sln --output Table --file-output licenses.txt
          if ($LASTEXITCODE -ne 0) { throw "License table report generation failed (exit $LASTEXITCODE)." }
        shell: pwsh

      - name: Display licenses
        run: |
          if (Test-Path licenses.txt) {
            Get-Content licenses.txt
          } else {
            Write-Host "License report not generated"
          }
        shell: pwsh

      - name: Check for forbidden licenses
        run: |
          ./tools/check-licenses.ps1 -ReportPath licenses.json
        shell: pwsh

      - name: Upload license report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: license-report
          path: |
            licenses.json
            licenses.txt
          retention-days: 30
          if-no-files-found: error
